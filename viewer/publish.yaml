# What `python -m viewer.export --all` publishes to docs/runs/, and how the grid groups it.
#
# A run is published only if all of these hold:
#   - its batch (the run id without its -NNN) matches a `batch` glob below;
#   - it ended at its horizon (run_end.reason = horizon), so unfinished or stopped runs stay out;
#   - its code was committed (run_start.code present, dirty: false), so PILOT runs stay out;
#   - its agent isn't an Ollama model (qwen runs are plumbing checks);
#   - its whole batch is done: no run in the batch is still going, and a batch with `lives: N` has
#     N run logs, all ended (whatever the reason). A batch goes up all at once, never part way.
# Only each --runs-dir itself is read, never its subdirectories, so archived runs stay out.
# Groups and batches appear on the page in this order. To publish a new experiment, add a group.
# Each group has a title, a one-line description (`line`) and a link to its findings on the project page
# (`findings`: href relative to the project page, and the link text). Copy rules: no middle dots or arrows.

groups:
  - id: exp01
    short: "Experiment 01"
    title: "Experiment 01: Maya, diversity attribution"
    line: "One-year lives of Maya in four conditions that vary the outcome dice, the opening order, both, or neither."
    findings: {href: "#exp01", text: "Experiment 01 findings"}
    batches:
      - {batch: "maya-exp01a-*", lives: 20, label: "a: vary dice only"}
      - {batch: "maya-exp01b-*", lives: 20, label: "b: vary order only"}
      - {batch: "maya-exp01c-*", lives: 20, label: "c: vary both"}
      - {batch: "maya-exp01d-*", lives: 20, label: "d: vary neither"}

  - id: showcase
    short: "Maya showcase"
    title: "Maya showcase"
    line: "Maya's first lives, before experiment 01; run 1 is from before the message and spend tools, so it isn't comparable with the rest."
    findings: {href: "#exp01", text: "Maya's findings"}
    batches:
      - {batch: "maya-20261029-012642", label: "v1, run 1"}
      - {batch: "maya-showv2-*", label: "v2"}

  - id: tracka
    short: "Track A"
    title: "Self, Track A"
    line: "Self's first life: two years in the student world."
    findings: {href: "#what-happened", text: "What happened"}
    batches:
      - {batch: "self-tracka4-*", label: "Track A"}

  - id: exp02a
    short: "Experiment 02 A"
    title: "Experiment 02 part A: Self as written"
    line: "Two-year lives of the base Self persona in the student world, one per seed."
    findings: {href: "#exp02", text: "Experiment 02 findings"}
    batches:
      - {batch: "self-base-*", lives: 5, label: "base"}

  - id: exp02b
    short: "Experiment 02 B"
    title: "Experiment 02 part B: Self, one change at a time"
    line: "Four versions of Self, each with one change to the persona or the world, on the same seeds as part A."
    findings: {href: "#exp02", text: "Experiment 02 findings"}
    batches:
      - {batch: "self-nosolo-nosolo-*", lives: 5, label: "nosolo: “founder” instead of “solo founder”"}
      - {batch: "self-socialgoal-socialgoal-*", lives: 5, label: "socialgoal: goal adds people to build with"}
      - {batch: "self-goalonly-goalonly-*", lives: 5, label: "goal+world: only name, goal, money and contacts"}
      - {batch: "self-hiddenstreak-*", lives: 5, label: "hiddenstreak: training streak never shown"}

  - id: exp03
    short: "Experiment 03"
    title: "Experiment 03: Self in world v3"
    line: "Self in world v3, where it can deploy a static site, invest its savings, go full time or decline offers, on the same seeds as part A."
    findings: {href: "#exp03", text: "Experiment 03 findings"}
    batches:
      - {batch: "self-v3-*", lives: 5, label: "v3"}
