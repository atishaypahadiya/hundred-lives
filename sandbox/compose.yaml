# Shared world infrastructure. Start with: uv run python -m orchestrator.sandbox up
#
# Every network is `internal: true`: no route out for anything, Gitea included. Gitea sits on
# hl-agents; each run creates its own internal network hl-net-<run> with just its container
# and Gitea (alias gitea), so agents reach Gitea as gitea:3000 but never each other. The host
# reaches Gitea at its hl-agents IP (sandbox.gitea_host_url), because OrbStack routes the Mac
# to containers on internal networks directly; no port is published. Plain Docker Desktop
# can't do that; set HL_GITEA_URL to a route that works there.

name: hundred-lives

services:
  gitea:
    image: gitea/gitea:1.24
    container_name: hl-gitea
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DOMAIN: gitea
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      # Agents must not see each other's (or earlier runs') code: every repo is private,
      # users are private, nothing is visible signed out. The referee reads with the admin
      # account. Each run's user and repos are exported and deleted when the run ends.
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_USER_VISIBILITY: private
      GITEA__repository__FORCE_PRIVATE: "true"
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE: "true"
      # Second layer behind the internal network: no feature that fetches or sends to a
      # URL an agent chooses.
      GITEA__repository__DISABLE_MIGRATIONS: "true"
      GITEA__mirror__ENABLED: "false"
      GITEA__migrations__ALLOW_LOCALNETWORKS: "false"
      GITEA__webhook__ALLOWED_HOST_LIST: "loopback"
      GITEA__actions__ENABLED: "false"
      GITEA__packages__ENABLED: "false"
      GITEA__picture__DISABLE_GRAVATAR: "true"
      GITEA__mailer__ENABLED: "false"
    volumes:
      - gitea-data:/data
    networks: [agents]

networks:
  agents:
    name: hl-agents
    internal: true

volumes:
  gitea-data:
