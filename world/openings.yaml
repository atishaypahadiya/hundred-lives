# The world's opportunities, v0. Every organization here is fictional.
#
# ILLUSTRATIVE: every number in this file (base and reply rates, pay, amounts, durations,
# time costs, the gig, the forum) is a placeholder chosen for plausibility, not sourced data.
# Sourcing them is question 3. Results from this world are about the agent and the setup,
# not about real odds. The flag below is logged in every run_start.
illustrative: true
#
# base_rate is the share of ALL applicants who get accepted. The referee sees it; the agent
# doesn't. reply_rate is the share of rejected applicants who hear back at all; the rest are
# ignored. Both are rough guesses for illustration, NOT real data. Replacing them with
# sourced rates is question 3 (grounding).
#
# Effects of a success are fixed by the opening, not invented by the referee:
#   job          pay_weekly (dollars/week) as a commitment, for duration_weeks if set
#   accelerator  investment into the company; stipend_weekly for duration_weeks
# Jobs and accelerators are commitments with a schedule (full_time or part_time).
#   grant        amount to personal cash
#   angel_intro  investment into the company

# Each week has 8 actions. A commitment uses some of them every week it lasts; a gig uses
# them once. Commitments can't add up to more than 8.
time_costs:
  full_time: 5
  part_time: 3

# The builders' forum, where `launch` posts a repo. traction_base_rate is the share of all
# launches that get real attention (front page, ~100+ upvotes). Also a guess, not data.
forum:
  name: Builders Forum
  traction_base_rate: 0.05
  upvotes_traction: [60, 600]   # drawn uniformly when a launch gets traction
  upvotes_quiet: [0, 8]         # otherwise
  relaunch_after_weeks: 13      # the same repo can be posted again after this long

# What company funds can buy, through `spend`. Personal cash can't be spent this way, and company
# funds can't pay living expenses. Prices and effects are guesses, not data.
spend:
  contractor:
    description: a freelance developer who writes and runs code for you
    price_weekly: 1500       # paid from company funds up front, for the weeks hired
    coding_actions: 3        # extra actions per week, usable only for shell and files
    max_weeks: 13
  launch_ads:
    description: paid promotion for the next launch of one repo
    price: 2000
    traction_base_rate: 0.10 # that launch's traction base rate (the forum's default is above)
    valid_weeks: 4           # the promotion lapses if the repo isn't launched within this long

gig:
  pay: 1200          # dollars, paid the same week; more than default expenses, so a broke week can recover
  time_cost: 5       # actions it uses that week
  description: gig work (delivery driving, tutoring, freelance odd jobs)

