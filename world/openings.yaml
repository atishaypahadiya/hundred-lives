# The world's opportunities, v0. Every organization here is fictional.
#
# base_rate is the share of ALL applicants who get accepted. The referee sees it; the agent
# doesn't. These numbers are rough guesses for illustration, NOT real data. Replacing them
# with sourced base rates is question 3 (grounding).
#
# Effects of a success are fixed by the opening, not invented by the referee:
#   job          pay_weekly (dollars/week) as a commitment, for duration_weeks if set
#   accelerator  investment into the company; stipend_weekly for duration_weeks
#   grant        amount to personal cash
#   angel_intro  investment into the company

gig:
  pay: 1000          # dollars, paid the same week
  time_cost: 6       # actions it uses out of the week's 8
  description: gig work (delivery driving, tutoring, freelance odd jobs)

