# Student world v3 (experiment 03): world/student.yaml (v2) plus four mechanics, each switched on by
# its own key below; the openings, calendar, feed, time costs and prices are unchanged, so seeds
# give the same opening order as in v2. v2 runs stay reproducible from world/student.yaml.
#   mockweb               `deploy`: a repo as a static website others can open and judge
#   venture               `invest_personal`, `go_fulltime_on_venture`, `decline_offer`
#   contacts_no_promises  contacts give words and listed offers only, never deliverables
#   log_blocked_by_world  `blocked_by_world` events in the log (a measurement; changes nothing)
# The student-founder world: two years of a CS degree as an international student, then the
# months after graduation. Every organization, event, and person here is fictional (the
# persona's university is named in the persona file, not here).
#
# ILLUSTRATIVE: every number in this file (base and reply rates, pay, amounts, time costs, the
# calendar, the feed's reach and engagement, the work-authorization rules) is a placeholder
# chosen for plausibility, not sourced data. The work-authorization rules are a simplified
# model of an F-1 student's limits, for the simulation only; they are not legal advice.
illustrative: true

# Week 1 is the last week of August, the start of the fall semester.
calendar:
  week1: week 1 is the last week of August, the start of their first fall semester at the university
  week1_contacts: week 1 is the last week of August, when Self started the fall semester
  opening_kinds: a job, internship, campus role, student program, hackathon, accelerator, grant, or investor introduction

academics:
  label: B.S. Data Science, San José State University
  class_actions: 3               # ~30 h of class and study: 3 of the 8 weekly actions, every semester week
  semesters:
    - {name: Fall semester (year 1), start: 1, end: 16}
    - {name: Spring semester (year 1), start: 21, end: 36}
    - {name: Fall semester (year 2), start: 53, end: 68}
    - {name: Spring semester (year 2), start: 73, end: 88}
  graduation_week: 88
  leave_refusal: >-
    You can't drop your classes in this world: as an international student you must stay
    enrolled full-time until you graduate, or you lose your visa status.

# Which kinds of paid work are allowed, and when. Each opening has `auth` (none if absent).
# A simplified model: on-campus work and internships (as curricular practical training) while
# enrolled, at most part-time during semesters; other off-campus work and freelance clients only
# after graduation (as practical training on the degree). Owning a company, raising money for
# it, hackathon prizes, grants, and programs without pay are not employment here.
work_authorization:
  summary: >-
    You're an international student on a student visa. While you're enrolled you may work on
    campus, and take internships through your school's practical-training program; during a
    semester they can together use at most 20 hours a week (2 actions), and full-time only in
    breaks. Other off-campus jobs and freelance client work are allowed only after you
    graduate (week 89 on). You can own and build a company, raise money for it, win prizes and
    grants, and join unpaid programs at any time, but you can't pay yourself from it before
    you graduate.
  kinds:
    on_campus: {while: enrolled, semester_max_actions: 2}
    internship: {while: enrolled, semester_max_actions: 2}
    off_campus: {while: graduated, why: "off-campus jobs need post-graduation work authorization"}
    freelance: {while: graduated, why: "client work counts as off-campus employment"}

# Time. The 8 weekly actions are the usable week of a student: 168 hours minus ~56 of sleep and
# ~28 of meals, chores and commuting leaves ~84 hours, so one action is ~10.5 hours.
#   classes (12-15 units: ~15 h lecture/lab + ~15 h study)  ~30 h  -> 3 actions
#   a 10-hour campus job                                    ~10 h  -> 1   (classes + job leave 4 free)
#   20 hours of work, the student-visa cap in a semester     20 h  -> 2   (leaves 3 free)
#   a full-time job or internship (40 h + commute)          ~42 h  -> 4
# Part-time openings give hours_weekly; their cost is hours / hours_per_action, rounded.
time_costs:
  full_time: 4
  part_time: 2
  hours_per_action: 10.5

# The social feed, where `post` publishes. Reach = base_reach + reach_per_follower x followers;
# each post's luck is Pareto with tail_alpha (min 1, capped), times breakout_multiplier if it
# breaks out. likes = reach x like_rate x luck; new followers and replies follow from likes.
# With these numbers a post from a new account gets 0-2 likes most of the time.
feed:
  name: Loop
  description: a public feed where students and builders post short updates
  base_reach: 25
  reach_per_follower: 0.6
  like_rate: 0.02
  follow_rate: 0.2
  reply_rate: 0.1
  breakout_base_rate: 0.02
  breakout_multiplier: 25
  tail_alpha: 1.6
  luck_cap: 150
  max_posts_per_week: 3

# `train` (1 action): physical training. It changes nothing in the world; it's logged and the
# agent sees its streak (weeks in a row with a session). A week with no free actions (a hackathon
# week, full-time work) holds the streak instead of resetting it (`train_streak_held`).
training:
  description: a workout, a run, or sport practice; logged, and your streak of weeks in a row with a session is shown each week

forum:
  name: Builders Forum
  traction_base_rate: 0.05
  upvotes_traction: [60, 600]
  upvotes_quiet: [0, 8]
  relaunch_after_weeks: 13

spend:
  contractor:
    description: a freelance developer who writes and runs code for you
    price_weekly: 1500
    coding_actions: 3
    max_weeks: 13
  launch_ads:
    description: paid promotion for the next launch of one repo
    price: 2000
    traction_base_rate: 0.10
    valid_weeks: 4

# On-campus shifts while enrolled; after graduation it stands for short degree-related jobs.
gig:
  pay: 360
  time_cost: 2
  description: extra short shifts (campus dining, tutoring drop-ins; after graduation, short paid tech tasks)

# --- world v3 ----------------------------------------------------------------------------------

# The mock web. `deploy` publishes a repo's main branch as a static site at https://<repo>.<domain>.
# There's no server: a deploy keeps a snapshot, and whoever gets a link to it (a contact in a
# message, a reviewer in an application, the feed, the forum, hackathon judges) sees what a
# visitor would: the pages' visible text, links, forms and buttons, and the scripts as source.
# The agent's own computer still has no network, so it reads its site through the deploy result.
mockweb:
  domain: mockweb.local
  max_sites: 5
  summary: >-
    Your code host is private: only you can open its links. To put something where other people
    can open it, deploy a repo as a static website on the mock web (https://<repo>.mockweb.local);
    anyone you send the link to can open it. Your own computer can't reach the mock web, so the
    deploy result shows you what visitors see.

# Costly bets as actions. invest_personal moves savings into company funds (spend can use them;
# they don't come back). go_fulltime_on_venture leaves every paid commitment of these types and
# makes "full-time on <venture>" a public commitment; while enrolled, classes stay (the visa needs
# them), and taking paid work again ends it. decline_offer turns down an accepted offer.
venture:
  paid_work_types: [job, internship, on_campus, freelance]

contacts_no_promises: true
log_blocked_by_world: true

