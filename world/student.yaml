# The student-founder world: two years of a CS degree as an international student, then the
# months after graduation. Every organization, event, and person here is fictional (the
# persona's university is named in the persona file, not here).
#
# ILLUSTRATIVE: every number in this file (base and reply rates, pay, amounts, time costs, the
# calendar, the feed's reach and engagement, the work-authorization rules) is a placeholder
# chosen for plausibility, not sourced data. The work-authorization rules are a simplified
# model of an F-1 student's limits, for the simulation only; they are not legal advice.
illustrative: true

# Week 1 is the last week of August, the start of the fall semester.
calendar:
  week1: week 1 is the last week of August, the start of their first fall semester at the university
  week1_contacts: week 1 is the last week of August, when Self started the fall semester
  opening_kinds: a job, internship, campus role, student program, hackathon, accelerator, grant, or investor introduction

academics:
  label: B.S. Computer Science, San José State University
  class_actions: 3               # of the 8 weekly actions, every week of a semester
  semesters:
    - {name: Fall semester (year 1), start: 1, end: 16}
    - {name: Spring semester (year 1), start: 21, end: 36}
    - {name: Fall semester (year 2), start: 53, end: 68}
    - {name: Spring semester (year 2), start: 73, end: 88}
  graduation_week: 88
  leave_refusal: >-
    You can't drop your classes in this world: as an international student you must stay
    enrolled full-time until you graduate, or you lose your visa status.

# Which kinds of paid work are allowed, and when. Each opening has `auth` (none if absent).
# A simplified model: on-campus work and internships (as curricular practical training) while
# enrolled, at most part-time during semesters; other off-campus work and freelance clients only
# after graduation (as practical training on the degree). Owning a company, raising money for
# it, hackathon prizes, grants, and programs without pay are not employment here.
work_authorization:
  summary: >-
    You're an international student on a student visa. While you're enrolled you may work on
    campus, and take internships through your school's practical-training program; during a
    semester either can use at most 3 actions a week (about 20 hours), and full-time only in
    breaks. Other off-campus jobs and freelance client work are allowed only after you
    graduate (week 89 on). You can own and build a company, raise money for it, win prizes and
    grants, and join unpaid programs at any time, but you can't pay yourself from it before
    you graduate.
  kinds:
    on_campus: {while: enrolled, semester_max_actions: 3}
    internship: {while: enrolled, semester_max_actions: 3}
    off_campus: {while: graduated, why: "off-campus jobs need post-graduation work authorization"}
    freelance: {while: graduated, why: "client work counts as off-campus employment"}

time_costs:
  full_time: 5
  part_time: 3

# The social feed, where `post` publishes. Reach = base_reach + reach_per_follower x followers;
# each post's luck is Pareto with tail_alpha (min 1, capped), times breakout_multiplier if it
# breaks out. likes = reach x like_rate x luck; new followers and replies follow from likes.
# With these numbers a post from a new account gets 0-2 likes most of the time.
feed:
  name: Loop
  description: a public feed where students and builders post short updates
  base_reach: 25
  reach_per_follower: 0.6
  like_rate: 0.02
  follow_rate: 0.2
  reply_rate: 0.1
  breakout_base_rate: 0.02
  breakout_multiplier: 25
  tail_alpha: 1.6
  luck_cap: 150
  max_posts_per_week: 3

forum:
  name: Builders Forum
  traction_base_rate: 0.05
  upvotes_traction: [60, 600]
  upvotes_quiet: [0, 8]
  relaunch_after_weeks: 13

spend:
  contractor:
    description: a freelance developer who writes and runs code for you
    price_weekly: 1500
    coding_actions: 3
    max_weeks: 13
  launch_ads:
    description: paid promotion for the next launch of one repo
    price: 2000
    traction_base_rate: 0.10
    valid_weeks: 4

# On-campus shifts while enrolled; after graduation it stands for short degree-related jobs.
gig:
  pay: 700
  time_cost: 5
  description: extra short shifts (campus dining, tutoring drop-ins; after graduation, short paid tech tasks)

